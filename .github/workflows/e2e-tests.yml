name: Selenium E2E Tests

on:
  push:
    branches: [qa-automation, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/ink2digital_test
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 5000
      HEADLESS: "true"
      BASE_URL: http://localhost:5173
      API_URL: http://localhost:5000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Selenium dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Start backend
        working-directory: server
        run: npm start > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: client
        run: npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for application
        run: |
          npx --yes wait-on http://localhost:5000/api/health http://localhost:5173 --timeout 60000
          sleep 5

      - name: Run Selenium tests
        working-directory: tests/e2e
        run: npm test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: tests/e2e/screenshots/

      - name: Upload application logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: /tmp/*.log